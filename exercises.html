<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Exercises — Singing Trainer</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main>
  <h1>Pitch exercises</h1>

  <div class="card" id="setup">
    <button class="primary big" id="micBtn">Enable microphone</button>
  </div>

  <div id="app" style="display:none">
    <div class="card tight" id="rangeCard">
      <h3 style="margin-top:0">Your comfortable range</h3>
      <p class="small dim">Targets are placed inside it — matching is much easier in your own range (Pfordresher &amp; Greenspon 2025). Hold each note ~2 s.</p>
      <div class="btnrow">
        <button id="lowBtn">Sing your lowest easy note</button>
        <button id="highBtn">Sing your highest easy note</button>
      </div>
      <p id="rangeTxt" class="dim small"></p>
    </div>

    <div class="card tight">
      <div class="pill-select" id="modes">
        <button data-m="match" class="on">Match a note</button>
        <button data-m="blind">Blind match</button>
        <button data-m="siren">Siren</button>
        <button data-m="interval">Intervals</button>
      </div>
      <p class="small dim" id="modeHelp" style="margin-top:8px"></p>
    </div>

    <div class="card tight">
      <div class="bignote" id="target">—</div>
      <div class="bigsub" id="status" role="status">press Start</div>
      <canvas id="ex" style="margin-top:8px"></canvas>
      <div class="btnrow">
        <button class="primary" id="goBtn">Start</button>
        <button id="replayBtn">🔊 Hear target</button>
      </div>
      <div class="small dim">Session <span id="scoreTxt">0 / 0</span> · streak <span id="streakTxt">0</span></div>
    </div>
  </div>
</main>
<script src="js/dsp.js?v=2"></script>
<script src="js/mic.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script>
UI.nav('exercises.html');
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const HELP = {
  match: 'Hear the note, hum it in your head, then sing and hold it. Green = within ±25¢, okay = ±50¢. Trace stays visible (training wheels on).',
  blind: 'Same task, but the trace is hidden while you sing and revealed after — this is what makes gains stick when the screen goes away (guidance-hypothesis research).',
  siren: 'Follow the moving line with a smooth “woooo” glide. Sirens build the gross pitch-motor map before precise targets.',
  interval: 'You hear and sing the first note, then must jump the named interval unaided. Interval control is what melodies are made of.',
};

let mode = 'match', running = false;
let range = UI.store.get('range', null);   // {lo, hi} midi
let exC = null;
let session = { ok: 0, n: 0, streak: 0 };

$('micBtn').addEventListener('click', async () => {
  try { await Mic.start(); } catch (e) {
    $('micBtn').textContent = 'Microphone blocked — check Settings › Safari › Microphone'; return;
  }
  $('setup').style.display = 'none';
  $('app').style.display = '';
  exC = UI.canvas2d($('ex'), 200);
  $('modeHelp').textContent = HELP[mode];
  updateRangeTxt();
});

document.querySelectorAll('#modes button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('#modes button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  mode = b.dataset.m;
  $('modeHelp').textContent = HELP[mode];
}));

// ---- range calibration ----
async function calibrate(which) {
  $('status').textContent = 'sing and hold…';
  const vals = [];
  const t0 = performance.now();
  while (performance.now() - t0 < 2500) {
    const r = Mic.livePitch();
    if (r && r.f0 > 0 && r.clarity > 0.6) vals.push(Notes.hzToMidi(r.f0));
    await sleep(40);
  }
  if (vals.length < 10) { $('status').textContent = 'didn’t catch that — try again, louder'; return; }
  vals.sort((a, b) => a - b);
  const med = vals[vals.length >> 1];
  range = range || {};
  if (which === 'lo') range.lo = med; else range.hi = med;
  if (range.lo != null && range.hi != null && range.lo > range.hi) [range.lo, range.hi] = [range.hi, range.lo];
  UI.store.set('range', range);
  $('status').textContent = 'got ' + Notes.name(Math.round(med));
  updateRangeTxt();
}
$('lowBtn').addEventListener('click', () => calibrate('lo'));
$('highBtn').addEventListener('click', () => calibrate('hi'));
function updateRangeTxt() {
  $('rangeTxt').textContent = range && range.lo != null && range.hi != null
    ? 'Range: ' + Notes.name(Math.round(range.lo)) + ' – ' + Notes.name(Math.round(range.hi)) +
      ' (targets stay a few semitones inside the ends)'
    : 'Not set — targets default to a middle range. Setting it makes exercises fit your voice.';
}

function pickTargetMidi(span = 0) {
  let lo = 55, hi = 67;                     // G3..G4 default
  if (range && range.lo != null && range.hi != null && range.hi - range.lo > 6) {
    lo = range.lo + 2; hi = range.hi - 2;
  }
  return lo + Math.random() * Math.max(1, hi - lo - span);
}

$('replayBtn').addEventListener('click', async () => {
  await Mic.resume();
  if (curTargetHz > 0) { Mic.toneOn(curTargetHz); setTimeout(Mic.toneOff, 900); }
});

let curTargetHz = -1;

$('goBtn').addEventListener('click', async () => {
  if (running) return;
  running = true; $('goBtn').disabled = true;
  $('ex').scrollIntoView({ behavior: 'smooth', block: 'center' });
  await Mic.resume();
  try {
    if (mode === 'match' || mode === 'blind') await runMatch(mode === 'blind');
    else if (mode === 'siren') await runSiren();
    else await runInterval();
  } finally {
    running = false; $('goBtn').disabled = false;
  }
});

/* Match a target note: tone (1.2s) -> audiate pause (0.8s) -> sing 3.5s.
   Scoring: median error of the last 2s; within-band time. */
async function runMatch(blind) {
  const midi = Math.round(pickTargetMidi());
  const hz = Notes.midiToHz(midi);
  curTargetHz = hz;
  $('target').textContent = Notes.name(midi);
  $('status').textContent = 'listen…';
  Mic.toneOn(hz); await sleep(1200); Mic.toneOff();
  $('status').textContent = 'hear it in your head…';
  await sleep(800);
  $('status').textContent = blind ? 'sing! (trace hidden)' : 'sing!';

  const SECS = 3.5, pts = [], t0 = performance.now() / 1000;
  while (performance.now() / 1000 - t0 < SECS) {
    const r = Mic.livePitch();
    const t = performance.now() / 1000 - t0;
    pts.push({ t, v: r && r.f0 > 0 && r.clarity > 0.5 ? Notes.hzToMidi(r.f0) * 100 : NaN });
    if (!blind) draw(pts, midi * 100, SECS);
    else { exC.ctx.clearRect(0, 0, exC.w, exC.h); }
    await sleep(30);
  }
  draw(pts, midi * 100, SECS);                       // reveal (also in blind mode)

  const late = pts.filter((p) => p.t > 1.2 && !isNaN(p.v)).map((p) => p.v - midi * 100);
  if (late.length < 8) { $('status').textContent = 'didn’t hear you — sing louder'; return; }
  late.sort((a, b) => a - b);
  const med = late[late.length >> 1];
  const within50 = late.filter((c) => Math.abs(c) <= 50).length / late.length;
  const ok = Math.abs(med) <= 50 && within50 >= 0.6;
  score(ok);
  $('status').textContent =
    (Math.abs(med) <= 25 ? '🎯 excellent — ' : ok ? '✓ in tune — ' : '✗ off — ') +
    'median ' + UI.fmt.cents(med) + (med > 50 ? ' (sharp)' : med < -50 ? ' (flat)' : '');
}

/* Siren: follow a slow sine glide over ±4 semitones. Scored on tracking error. */
async function runSiren() {
  const center = pickTargetMidi(8) + 4;
  curTargetHz = Notes.midiToHz(center);
  $('target').textContent = 'siren';
  $('status').textContent = 'follow the line…';
  const SECS = 6, pts = [], tgt = [], t0 = performance.now() / 1000;
  Mic.toneOn(Notes.midiToHz(center));
  while (performance.now() / 1000 - t0 < SECS) {
    const t = performance.now() / 1000 - t0;
    const m = center + 4 * Math.sin((t / SECS) * 2 * Math.PI);
    Mic.toneSet(Notes.midiToHz(m));
    tgt.push({ t, v: m * 100 });
    const r = Mic.livePitch();
    pts.push({ t, v: r && r.f0 > 0 && r.clarity > 0.5 ? Notes.hzToMidi(r.f0) * 100 : NaN });
    drawSiren(pts, tgt, SECS);
    await sleep(30);
  }
  Mic.toneOff();
  let err = 0, cnt = 0;
  for (let i = 0; i < pts.length; i++) {
    if (isNaN(pts[i].v)) continue;
    err += Math.min(600, Math.abs(pts[i].v - tgt[i].v)); cnt++;
  }
  if (cnt < 20) { $('status').textContent = 'didn’t hear you — sing louder'; return; }
  const mean = err / cnt;
  const ok = mean <= 75;
  score(ok);
  $('status').textContent = (ok ? '✓ ' : '✗ ') + 'average distance ' + mean.toFixed(0) + '¢ (target ≤75¢)';
}

/* Interval: tone plays root; user sings root then leaps the interval. */
const INTERVALS = [[2,'major 2nd'],[3,'minor 3rd'],[4,'major 3rd'],[5,'perfect 4th'],[7,'perfect 5th'],[12,'octave']];
async function runInterval() {
  const [semis, iname] = INTERVALS[Math.floor(Math.random() * INTERVALS.length)];
  const root = Math.round(pickTargetMidi(semis));
  const goal = root + semis;
  curTargetHz = Notes.midiToHz(root);
  $('target').textContent = iname + ' ↑';
  $('status').textContent = 'root: ' + Notes.name(root) + ' — listen…';
  Mic.toneOn(curTargetHz); await sleep(1100); Mic.toneOff();
  $('status').textContent = 'sing root (1.5s), then jump UP a ' + iname;
  const SECS = 4.5, pts = [], t0 = performance.now() / 1000;
  while (performance.now() / 1000 - t0 < SECS) {
    const r = Mic.livePitch();
    const t = performance.now() / 1000 - t0;
    pts.push({ t, v: r && r.f0 > 0 && r.clarity > 0.5 ? Notes.hzToMidi(r.f0) * 100 : NaN });
    draw(pts, goal * 100, SECS, root * 100);
    await sleep(30);
  }
  const late = pts.filter((p) => p.t > 2.6 && !isNaN(p.v)).map((p) => p.v - goal * 100);
  if (late.length < 8) { $('status').textContent = 'didn’t catch the top note — hold it longer'; return; }
  late.sort((a, b) => a - b);
  const med = late[late.length >> 1];
  const ok = Math.abs(med) <= 60;
  score(ok);
  $('status').textContent = (ok ? '✓ ' : '✗ ') + 'top note ' + UI.fmt.cents(med) + ' from ' + Notes.name(goal);
}

function draw(pts, targetCents, secs, rootCents) {
  const lo = targetCents - 700, hi = targetCents + 700;
  const o = UI.drawTrace(exC.ctx, exC.w, exC.h, pts, { t0: 0, t1: secs, lo, hi, target: targetCents });
  if (o && rootCents != null) {
    exC.ctx.strokeStyle = 'rgba(147,160,180,0.8)'; exC.ctx.setLineDash([2, 4]);
    exC.ctx.beginPath(); exC.ctx.moveTo(0, o.Y(rootCents)); exC.ctx.lineTo(exC.w, o.Y(rootCents)); exC.ctx.stroke();
    exC.ctx.setLineDash([]);
  }
}
function drawSiren(pts, tgt, secs) {
  const base = tgt[0].v;
  UI.drawTrace(exC.ctx, exC.w, exC.h, tgt, { t0: 0, t1: secs, lo: base - 800, hi: base + 800, color: 'rgba(111,227,165,0.7)' });
  // overlay user's trace without clearing
  const { ctx, w, h } = exC;
  const lo = base - 800, hi = base + 800;
  ctx.lineWidth = 2; ctx.strokeStyle = UI.css('--accent'); ctx.beginPath();
  let pen = false;
  for (const p of pts) {
    if (isNaN(p.v)) { pen = false; continue; }
    const x = (p.t / secs) * w, y = h - ((p.v - lo) / (hi - lo)) * h;
    if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function score(ok) {
  session.n++; if (ok) { session.ok++; session.streak++; } else session.streak = 0;
  $('scoreTxt').textContent = session.ok + ' / ' + session.n;
  $('streakTxt').textContent = session.streak;
  const day = new Date().toISOString().slice(0, 10);
  const log = UI.store.get('exlog', {});
  log[day] = log[day] || { n: 0, ok: 0 };
  log[day].n++; if (ok) log[day].ok++;
  UI.store.set('exlog', log);
}
</script>
</body>
</html>
